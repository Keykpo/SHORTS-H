version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: animeshorts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: animeshorts
      POSTGRES_PASSWORD: animeshorts_password
      POSTGRES_DB: anime_shorts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - animeshorts-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: animeshorts-redis
    restart: unless-stopped
    command: redis-server --requirepass animeshorts_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - animeshorts-network

  # Backend API (development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: animeshorts-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://animeshorts:animeshorts_password@postgres:5432/anime_shorts
      REDIS_URL: redis://:animeshorts_redis_password@redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    networks:
      - animeshorts-network
    command: npm run dev

  # Frontend (development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: animeshorts-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - animeshorts-network
    command: npm run dev

  # Adminer (Database Management UI)
  adminer:
    image: adminer:latest
    container_name: animeshorts-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - animeshorts-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  animeshorts-network:
    driver: bridge
